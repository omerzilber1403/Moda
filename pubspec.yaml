name: moda
description: Tinder-style swipe app for swapping second-hand clothes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_card_swiper: ^7.0.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4
  socket_io_client: ^3.0.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  supabase_flutter: ^2.8.4
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  flutter_image_compress: ^2.4.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
